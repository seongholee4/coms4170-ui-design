{% extends "layout.html" %}

{% block content %}
<link rel="stylesheet" href="{{url_for('static', filename='styles/learn.css')}}">

<script type="text/javascript">
    $(document).ready(function () {
        $("#right_button").click(function () {
            if ("{{lesson.next_lesson}}" == "end") {
                window.location.href = "/start_quiz";
            } else {
                window.location.href = "/learn/{{lesson.next_lesson}}";
            }
        });


        $("#left_button").click(function () {
            if ("{{lesson.lesson_id}}" == "1") {
                window.location.href = "/";
            } else {
                window.location.href = "/learn/" + (parseInt("{{lesson.lesson_id}}")-1);
            }
        });

        $('.clickable-item').click(function() {
            var category = $(this).data('category');
            var newDescription = $(this).data('description');
            var newImageSrc = "";
            if (category == "dipping sauce") {
                newImageSrc = "{{lesson.dipping_sauce_image}}";
            } else {
                newImageSrc = "{{lesson.image}}";
            }
            
            $('#interactive-image').attr('src', newImageSrc);
            category = category.charAt(0).toUpperCase() + category.slice(1);
            newDescription = newDescription.charAt(0).toUpperCase() + newDescription.slice(1);
            $('#category').html("<strong>" + category + "</strong>");
            $('#description').html(newDescription);
            
            // $('#image-description').html("<div>" + category + "</div>" + "<div class=>" newDescription + ".");
        });

        $('.clickable-item').click(function() {
            $('.clickable-item').removeClass('active-state');
            $(this).addClass('active-state');
        });

    });

</script>

<div class="lesson-div container">
    <div class="title-info-group row">
        <div class="lesson-title-div col-12">
            <span class="lesson-title col-12 text-center">{{lesson.title}}</span>
        </div>
        <div class="lesson-info-div col-12">
            <div class="lesson-about-category-div col-6">
                {% for category, description in lesson.about.items() %}
                <div class="clickable-item" data-category="{{category}}" data-description="{{description}}">{{category|capitalize}}</div>
                {% endfor %}
            </div>
            <div class="image-desecription-group col-6">
                <div class="image-div col-12">
                    <img id="interactive-image" src="{{lesson.image}}" alt="Lesson image" class="img-fluid lesson-image col-12">                    
                </div>
                <div class="description-div col-12">
                    <div id="category" class="lesson-text text-center col-12"></div>
                    <div id="description" class="lesson-text text-center col-12">{{lesson.text}}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-buttons-group row">
        <div class="lesson-num-div">{{lesson.lesson_id}} / {{total_lessons}}</div>
        <div class="navigation-buttons">
            <button id="left_button" class="btn custom-button" alt="Left button"><i class="bi bi-chevron-left"></i></button>
            <button id="right_button" class="btn custom-button" alt="Right button"><i class="bi bi-chevron-right"></i></button>
        </div>
    </div>
</div>

{% endblock %}
