{% extends "layout.html" %}
{% block content %}

<link rel="stylesheet" href="{{url_for('static', filename='styles/quiz_results.css')}}">

<div class="text-center">
    <div class="">
        <h1>
            Quiz <br>
            Results
        </h1>
    </div>
    <div class="">
        <img src="{{ url_for('static', filename='images/hotpot_image_1.png') }}" class="center-image" alt="hotpot_image_1">
        <div class="">
            <p>Your score:</p>
            <p>{{ score }}/{{ total_questions }}</p>
        </div>
    </div>
    <div>
        <a href="/start_quiz" class="btn custom-button mt-3" alt="Start quiz button">Start a new quiz</a>
        <a href="/" class="btn custom-button mt-3" alt="Main page button">Main Page</a>
    </div>
</div>

{% endblock %}
