{% extends "layout.html" %}

{% block content %}

<link rel="stylesheet" href="{{url_for('static', filename='styles/quiz.css')}}">

<script type="text/javascript">
    $(document).ready(function () {
        $("#submit_answer").click(function() {
            $.ajax({
                type: "POST",
                url: "/quiz/{{ question.quiz_id }}/check_answer",
                data: {
                    answer: $('input[name="answer"]:checked').val(),
                },
                success: function(response) {
                    if (response.correct) {
                        $("#feedback").html("<div class='alert alert-success'>Correct!</div>");
                    } else {
                        console.log(response);
                        $("#feedback").html("<div class='alert alert-danger'>" + response.message + "</div>");
                        if (response.hint) {
                            $("#feedback").append("<div class='hint'>Hint: " + response.hint + "</div>");
                        }
                    }
                }
            });
        });

        $("#right_button").click(function () {
            if ("{{question.next_question}}" == "end") {
                window.location.href = "/quiz_results";
            } else {
                window.location.href = "/quiz/" + (parseInt("{{quiz_id}}")+1);
            }
        });

        $("#left_button").click(function () {
            if ("{{question.prev_question}}" == "start") {
                sessionStorage.removeItem('startTime');
                window.location.href = "/start_quiz";
            } else {
                window.location.href = "/learn/" + (parseInt("{{quiz_id}}")-1);
            }
        });
    });
</script>


<div class="mt-3 quiz-container">
    <h1>Q{{ question.quiz_id }}. {{ question.question }}</h1>
    
    <div id="feedback" alt="feedback"></div>

    <div class="row question-container">
        {% for answer in question.answers %}
            <input type="radio" name="answer" value="{{ answer }}" id="{{ answer }}" alt="Select {{answer}}">
            <label for="{{ answer }}" class="darkgray_color" alt="{{answer|capitalize}} label">{{ answer }}. {{ question.answers[answer] }}</label><br>
        {% endfor %}
    </div>
    <div class="quiz-button-group">
        <div class="submit-button-container">
            <button id="submit_answer" class="btn custom-button" alt="Submit button">Submit</button>
        </div>
        <div class="quiz-button-container">
            <button id="left_button" class="btn custom-button" alt="Left button"><i class="bi bi-chevron-left"></i></button>
            <button id="right_button" class="btn custom-button" alt="Right button"><i class="bi bi-chevron-right"></i></button>
        </div>
    </div>
</div>

{% endblock %}
