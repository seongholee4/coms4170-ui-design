{% extends "layout.html" %}

{% block content %}
<link rel="stylesheet" href="{{url_for('static', filename='styles/quiz.css')}}">

<script type="text/javascript" src="{{url_for('static', filename='scripts/quiz.js')}}"></script>

<div class="jumbotron text-center">
    <div class="mt-3">
        <h1 class="jumbotron-heading darkbrown_color">Start Your Quiz</h1>
        <p class="lead darkgray_color">Test your knowledge by starting the quiz now!</p>
    </div>
    <div class="card darkbrown_bg">
        <!-- <button onclick="window.location.href='/'" class="btn btn-secondary custom-button">Main Page</button> -->
        <img src="{{ url_for('static', filename='images/start_quiz.png') }}" alt="Quiz Time" class="center-image">
        <a href="/quiz/1" class="btn card-button lightgray_color" onclick="startQuiz()">Quiz Time!</a>
    </div>
    <div id="timerDisplay"></div>
</div>

{% endblock %}
