{% extends "layout.html" %}

{% block content %}

<script type="text/javascript">
    // let lesson = {{ lesson| tojson}};
    $(document).ready(function () {
        $("#next_button").click(function () {
            if ("{{lesson.next_lesson}}" == "end") {
                window.location.href = "/start_quiz";
            } else {
                window.location.href = "/learn/{{lesson.next_lesson}}";
            }
        });

        $("#previous_button").click(function () {
            if ("{{lesson.lesson_id}}" == "1") {
                window.location.href = "/";
            } else {
                window.location.href = "/learn/" + (parseInt("{{lesson.lesson_id}}")-1);
            }
        });

        // $("#main").click(function () {
        //     window.location.href = "/";
        // });

    });

</script>

{{lesson.lesson_id}}. {{lesson.title}}<br>
<br>
<img src="{{lesson.image}}" alt="{{lesson.title}}" width="300" height="300"><br>
{{lesson.text}}<br>
<button id="previous_button" class="btn custom-button">Previous</button>
<button id="next_button" class="btn custom-button"> Next </button>

{% endblock %}
